# osEngineer's own CI. This repo had no CI surface at all: post-commit.sh
# hard-exits under CI and install.sh skips its wizard there, so nothing was ever
# validated automatically. The gate lands here first, before any check becomes
# required on a consuming repo.
name: osEngineer

on:
  push:
    branches: [master, main]
  pull_request:
  merge_group:

permissions:
  contents: read

env:
  # Never inherit a bypass from the environment: CI is the one place the rules
  # must hold unconditionally.
  OSE_BYPASS: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Shell syntax
        run: bash -n install.sh && bash -n uninstall.sh && for f in hooks/*.sh; do bash -n "$f"; done

      - name: Test suite
        run: python3 -m unittest discover -s test -p 'test_*.py' -v

  commit-messages:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Each `run:` block is a separate shell, so the range must travel through
      # $GITHUB_OUTPUT rather than a plain shell variable.
      - id: range
        name: Compute commit range
        run: |
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            base="${{ github.event.merge_group.base_sha }}"
            head="${{ github.event.merge_group.head_sha }}"
          else
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Conventional Commits
        run: |
          set -euo pipefail
          # validate-commit.sh exits 0 when .osengineer/state.yml is absent, and
          # state.yml is per-install, never committed. Activate the hook, then
          # prove it rejects a bad message so the gate cannot pass vacuously.
          mkdir -p .osengineer && touch .osengineer/state.yml
          probe="$(mktemp)"; echo "not a conventional commit" > "$probe"
          if bash hooks/osEngineer-validate-commit.sh "$probe" 2>/dev/null; then
            echo "::error::commit-msg hook accepted a non-conventional message — gate would pass vacuously"
            exit 1
          fi
          fail=0
          while read -r sha; do
            [ -n "$sha" ] || continue
            msg_file="$(mktemp)"
            git log -1 --format=%B "$sha" > "$msg_file"
            if ! bash hooks/osEngineer-validate-commit.sh "$msg_file"; then
              echo "::error::commit $sha does not follow Conventional Commits"
              fail=1
            fi
          done < <(git rev-list "${{ steps.range.outputs.base }}..${{ steps.range.outputs.head }}")
          exit $fail
