# Example message-contract.yaml — validates against
# specs/SCHEMAS/message-contract.schema.json.
#
# Drop one of these per AMQP exchange × routing-key your service produces.
# Place under contracts/amqp/<contract_id>.yaml in the service repo.
# Both producer and all consumers MUST reference the same contract.

contract_id: MC-strategist-decision-created
version: 1.2.0
status: active

producer:
  service: <management-service>
  team: coding

consumers:
  - service: <logging-service>
    consumer_group: scribe-decision-archive
  - service: OS-MDashboard
    consumer_group: mdashboard-live-feed

exchange:
  name: ex.strategist.decisions
  type: topic

routing_key: strategist.decision.created
vhost: shield_internal

payload:
  schema_ref: contracts/amqp/decision.schema.json
  encoding: json
  fields:
    - name: decision_id
      type: string
      required: true
      description: ULID generated by the strategist
      added_in: 1.0.0
    - name: created_at
      type: string
      required: true
      description: RFC3339 timestamp
      added_in: 1.0.0
    - name: subject_ref
      type: string
      required: true
      description: Foreign key to the issue/incident this decision pertains to
      added_in: 1.0.0
    - name: rationale_markdown
      type: string
      required: false
      description: Human-readable explanation; opt-in field
      added_in: 1.1.0
    - name: confidence_score
      type: number
      required: false
      description: 0..1 model confidence (omitted when human-authored)
      added_in: 1.2.0

delivery:
  guarantee: at-least-once
  max_retries: 5
  dlx: ex.dead-letter

adr_refs:
  - ADR-014
